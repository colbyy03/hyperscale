[project]
name = "hsgrade"
version = "0.1.0"
description = "Grading helpers and pytest plugin for Hyperscale exercises (runs in Pyodide and CPython)"
requires-python = ">=3.12"
# Pinned to the versions bundled with Pyodide 314.0.7 so local runs match the browser exactly.
dependencies = ["numpy==2.4.6", "pytest==9.0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
