name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # After npm ci (which wipes node_modules): Pyodide wheels such as Polars and DuckDB are large, so keep them between runs.
      - name: Cache Pyodide packages for exercise verification
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/pyodide
          key: pyodide-314.0.7-${{ hashFiles('content/modules/*/exercises/*/exercise.json') }}
          restore-keys: pyodide-314.0.7-
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Validate content
        run: npm run validate -- --quiet
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Grader library tests (CPython 3.14, Pyodide-matched versions)
        run: npm run test:python
      - name: Verify every exercise in Pyodide (solution passes, starter and known mistakes fail)
        run: npm run verify:exercises
      - name: Build
        run: npm run build
      - name: End-to-end smoke tests (installed Chrome)
        run: npx playwright test --project=desktop --project=phone
