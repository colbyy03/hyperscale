name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Validate content
        run: npm run validate -- --quiet
      - name: Build
        run: npm run build
      - name: End-to-end smoke tests (installed Chrome)
        run: npx playwright test --project=desktop --project=phone
